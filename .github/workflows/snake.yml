name: Snake de contribuciones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar SVG de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: jhonatan-sz
          outputs: |
            dist/github-snake.svg?color_snake=%23FF3B30&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF3B30&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Copiar a assets
        run: |
          mkdir -p assets
          cp dist/github-snake.svg assets/github-snake.svg
          cp dist/github-snake-dark.svg assets/github-snake-dark.svg

      - name: Commit de los SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(snake): actualiza contribuciones"
          file_pattern: assets/github-snake*.svg
